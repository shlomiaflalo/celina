# Celina — nginx (single-origin: статика фронтенда + /api и /uploads на Node :4000)
# Скопировать в /etc/nginx/sites-available/celina, заменить домен и путь, затем:
#   ln -s /etc/nginx/sites-available/celina /etc/nginx/sites-enabled/celina
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d celina.ru -d www.celina.ru   # HTTPS

server {
    listen 80;
    server_name celina.ru www.celina.ru;

    # собранный фронтенд (vite-react-ssg build → frontend/dist)
    root /var/www/celina/frontend/dist;
    index index.html;

    # видео-селфи и документы верификации — поднять лимит тела запроса
    client_max_body_size 60M;

    # API → Node-бэкенд
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # загруженные файлы (фото блюд, документы) обслуживает бэкенд
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }

    # страницы поваров и застолий → Node: он подставляет OG/Twitter-теги
    # (соцсети не выполняют JS; статический index.html дал бы пустое превью
    # для всех поваров/застолий, созданных ПОСЛЕ сборки).
    # Требует FRONTEND_DIST в backend/.env (см. DEPLOY.md шаг 2).
    location ~ ^/(gatherings|cooks)(/|$) {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSG: сначала готовый .html, затем SPA-фолбэк на index.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
