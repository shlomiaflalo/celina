# Celina — nginx на ХОСТЕ перед Docker-контейнером (продовая схема с HTTPS).
#
# Схема: nginx слушает 80/443 и проксирует ВСЁ (статика отдаётся Node из
# FRONTEND_DIST внутри контейнера) на Node, который слушает 127.0.0.1:4000
# (docker-compose: CELINA_PORT=4000, CELINA_HOST=127.0.0.1 в /root/celina/.env).
#
# Два server-блока:
#   1) голый IP (default_server) — всегда отдаёт сайт (внутренний доступ);
#   2) домен — до церемониального запуска показывает заглушку «скоро открытие»
#      (пока существует /var/www/celina-launch/prelaunch.flag), после — сайт.
#      Тот же флаг годится как «режим обслуживания»: touch файла → заглушка.
#
# Кнопка запуска: deploy/launch/launch_server.py (systemd celina-launch,
# 127.0.0.1:9099) — страница /zapusk-<секрет> удаляет флаг по нажатию.
#
# Установка:
#   cp deploy/nginx-docker-proxy.conf /etc/nginx/sites-available/celina
#   ln -sf /etc/nginx/sites-available/celina /etc/nginx/sites-enabled/celina
#   rm -f /etc/nginx/sites-enabled/default
#   mkdir -p /var/www/certbot /var/www/celina-launch
#   cp deploy/launch/prelaunch.html /var/www/celina-launch/
#   touch /var/www/celina-launch/prelaunch.flag   # держать заглушку до запуска
#   nginx -t && systemctl reload nginx
# HTTPS (после того как DNS домена укажет на сервер):
#   certbot --nginx -d celinaeda.ru -d www.celinaeda.ru --redirect \
#     --non-interactive --agree-tos -m <email>

# ── 1) голый IP: сайт всегда доступен (обход заглушки для своих) ──
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 60M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/events {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ── 2) домен: заглушка до запуска, сайт после ──
server {
    listen 80;
    server_name celinaeda.ru www.celinaeda.ru;

    client_max_body_size 60M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # церемониальная кнопка запуска (секретный путь, сервис на 9099)
    location /zapusk- {
        proxy_pass http://127.0.0.1:9099;
        proxy_set_header Host $host;
    }

    # заглушка «скоро открытие» (отдаётся на 503, пока есть флаг)
    error_page 503 @prelaunch;
    location @prelaunch {
        root /var/www/celina-launch;
        rewrite ^ /prelaunch.html break;
        add_header Cache-Control "no-store";
    }

    # SSE (реальное время: заказы/звонки) — без буферизации, долгий таймаут
    location /api/events {
        if (-f /var/www/celina-launch/prelaunch.flag) { return 503; }
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # всё остальное (статика фронтенда, /api, /uploads) — Node в контейнере
    location / {
        if (-f /var/www/celina-launch/prelaunch.flag) { return 503; }
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
