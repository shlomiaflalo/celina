<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Селина — скоро открытие</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 800px at 50% 20%, #2a1c0e 0%, #17100a 60%, #100b06 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #f5ead9; text-align: center; padding: 24px;
  }
  .wrap { max-width: 560px; }
  .logo {
    font-size: 64px; font-weight: 800; letter-spacing: 1px; color: #e0860c;
    margin-bottom: 8px;
  }
  .tag { font-size: 20px; opacity: .9; margin-bottom: 28px; }
  .soon {
    display: inline-block; padding: 12px 28px; border: 2px solid #e0860c; border-radius: 999px;
    color: #e0860c; font-size: 18px; font-weight: 600; letter-spacing: .5px;
  }
  .domain { margin-top: 36px; font-size: 14px; opacity: .55; }
  .pot { font-size: 44px; margin-bottom: 10px; animation: steam 2.4s ease-in-out infinite; }
  @keyframes steam { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="pot">🍲</div>
    <div class="logo">Селина</div>
    <div class="tag">Домашняя еда от соседей</div>
    <div class="soon">Скоро открытие</div>
    <div class="domain">celinaeda.ru</div>
  </div>
</body>
</html>
