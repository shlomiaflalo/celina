# Celina — производительность nginx (мобильные сети).
# Установка: cp deploy/nginx-perf.conf /etc/nginx/conf.d/celina-perf.conf && nginx -t && systemctl reload nginx
# ВАЖНО: «gzip on» уже включён в базовом nginx.conf Ubuntu — здесь только расширение.
# HTTP/2: в listen-строке 443-блока должно быть «listen 443 ssl http2;» (nginx ≤1.24).
#
# Эффект: основной JS-бандл 952KB → ~287KB по сети; без gzip мобильная
# гидратация занимала 10–30 сек и все кнопки «не работали» до её конца.
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/xml application/xml application/rss+xml;
