<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f7f3ed" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Celina" />
    <!-- Заголовок/описание/OG/Twitter задаёт <Seo> per-route (vite-react-ssg Head):
         у каждой страницы свои метаданные без дублей. Шаблонный <title> не ставим,
         иначе он перекрывает per-route заголовок при пререндере. -->
    <!-- Шрифт свой, с нашего же домена. Раньше здесь висели два обращения к
         Google (fonts.googleapis.com + fonts.gstatic.com) ради Fredoka и Inter.
         Fredoka не содержит НИ ОДНОЙ кириллической глифы — проверено замером
         ширины на живом сайте: «Селина» рисовалась системным засечным
         фолбэком. То есть фирменный шрифт не работал на языке, на котором
         написан весь сайт. Плюс из России домены Google медленные и не всегда
         доступны, а IP каждого посетителя уезжал к третьей стороне (152-ФЗ).
         Onest нарисован сразу с кириллицей; кириллический сабсет грузим
         заранее — это первый текст, который увидит человек. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/onest-cyrillic.woff2" crossorigin />
    <!-- Маяк ошибок устройства: инлайн (НЕ в бандле!) и на ES5 — ловит даже
         SyntaxError самого бандла на старых iPhone/Android (иначе такие устройства
         молча получают мёртвую страницу, а мы ничего не видим в логах сервера).
         Шлёт максимум 3 отчёта за загрузку страницы на /api/client-log. -->
    <script>
      (function () {
        var sent = 0;
        function report(kind, msg) {
          try {
            if (sent >= 3) return;
            sent++;
            var body = JSON.stringify({
              kind: kind,
              msg: String(msg).slice(0, 500),
              ua: navigator.userAgent,
              url: location.pathname
            });
            if (navigator.sendBeacon) {
              navigator.sendBeacon("/api/client-log", new Blob([body], { type: "application/json" }));
            } else {
              var x = new XMLHttpRequest();
              x.open("POST", "/api/client-log", true);
              x.setRequestHeader("Content-Type", "application/json");
              x.send(body);
            }
          } catch (e) { /* молча */ }
        }
        window.addEventListener("error", function (e) {
          report("error", (e.message || "?") + " @ " + (e.filename || "?") + ":" + (e.lineno || 0));
        });
        window.addEventListener("unhandledrejection", function (e) {
          report("unhandledrejection", e.reason && (e.reason.stack || e.reason.message) || String(e.reason));
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
